[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cobgdb-python"
version = "0.1.0"
description = "Independent JSON debugger backend for GnuCOBOL and GDB"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PyQt5>=5.15,<6"]

[project.scripts]
cobgdb-python = "cobgdb_python.backend:main"
cobgdb-python-gui = "cobgdb_python.frontend:main"

[tool.setuptools.packages.find]
include = ["cobgdb_python*"]

[tool.setuptools.package-data]
cobgdb_python = ["resources/*.svg", "resources/*.md"]
